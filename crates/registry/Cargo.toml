[package]
name = "registry"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"
game-core = { path = "../game-core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
near-sdk = { version = "=5.30.1", features = ["non-contract-usage"] }
